apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: media
spec:
  destination:
    namespace: media
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - jsonPointers:
        - /data
      kind: Secret
  project: media
  source:
    path: media
    repoURL: https://github.com/csfreak/homelab.git
    targetRevision: snolab
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
        policy.sigstore.dev/include: "true"
        network.homelab.csfreak.com/media: enabled
      annotations:
        app.openshift.io/vcs-uri: "https://github.com/csfreak/homelab.git"
        app.openshift.io/vcs-ref: snolab
        k8s.ovn.org/multicast-enabled: "true"
