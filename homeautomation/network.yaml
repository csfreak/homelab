apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: homeautomation
  namespace: homeautomation
spec:
  config: |-
    {
      "cniVersion": "0.4.0",
      "name": "homeautomation",
      "type": "ovn-k8s-cni-overlay",
      "topology": "localnet",
      "vlanID": 4,
      "mtu": 1500,
      "netAttachDefName": "homeautomation/homeautomation"
      "ipam": {
            "type": "dhcp",
            "provide": [
              {
                "option": "host-name",
                "fromArg": "K8S_POD_NAME"
              },
              {
                "option": "vendor-class-identifier",
                "value": "openshift"
              }
            ],
            "request": [
              {
                "option": "subnet-mask",
                "skipDefault": true 
              }
            ]
          }
    }
