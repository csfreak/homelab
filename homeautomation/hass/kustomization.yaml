resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - monitoring.yaml
  - route.yaml

images:
  - name: homeassistant/home-assistant
    newName: ghcr.io/home-assistant/home-assistant
    newTag: 2026.7.4
    digest: sha256:5a531753cea96444200158fc2b0ac7ccd739291ec50414877b396de6e0bb29b3
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/name: hass
  - includeSelectors: true
    pairs:
      app: homeassistant
      app.kubernetes.io/component: homeassistant

generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=true

configMapGenerator:
  - behavior: create
    envs:
      - backup-conf.env
    name: hass-backup
  - behavior: create
    files:
      - containerenv
    name: hass-containerenv
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
