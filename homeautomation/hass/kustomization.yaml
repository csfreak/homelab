resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - monitoring.yaml
  - route.yaml

images:
  - name: homeassistant/home-assistant
    newName: ghcr.io/home-assistant/home-assistant
    newTag: 2026.10.1
    digest: sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/name: hass
  - includeSelectors: true
    pairs:
      app: homeassistant
      app.kubernetes.io/component: homeassistant

generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=true

configMapGenerator:
  - behavior: create
    envs:
      - backup-conf.env
    name: hass-backup
  - behavior: create
    files:
      - containerenv
    name: hass-containerenv
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
