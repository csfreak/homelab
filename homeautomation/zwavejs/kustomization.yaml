resources:
  - pvc.yaml
  - serviceaccount.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - monitoring.yaml
  - route.yaml

labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: zwavejs
      app.kubernetes.io/name: zwavejs
      app.kubernetes.io/part-of: homeassistant
  - includeSelectors: true
    pairs:
      app: zwavejs

images:
  - name: zwavejs
    newName: ghcr.io/zwave-js/zwave-js-ui
    newTag: 11.24.3
    digest: sha256:3fef66d575ea0ea9d50aad3e05c36619228557cfa888557eac2035215a29a321

generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=true
  immutable: true

configMapGenerator:
  - envs:
      - zwavejs.env
    name: zwavejs-env
  - envs:
      - backup-conf.env
    name: zwavejs-backup
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
